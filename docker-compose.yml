services:
  postgres:
    image: postgres:18-alpine
    container_name: mrb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: repair_workshop
      POSTGRES_USER: repair_app
      POSTGRES_PASSWORD: change-me-in-env
      TZ: Asia/Tehran
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repair_app -d repair_workshop"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
